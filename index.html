<!DOCTYPE html>
<html>

<head>
  <title>Darren Pinheiro's Page</title>
  <style>
    body {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif; 
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      color: #333333; 
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background-color: white;
      padding: 50px 40px;
      border-radius: 20px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
      max-width: 600px;
      width: 90%; 
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 5px;
      font-size: 2.8rem; 
      background: linear-gradient(270deg, #8b5cf6, #3b82f6, #ec4899, #8b5cf6);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glowing-text 6s ease infinite;
    }

    @keyframes glowing-text {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      color: #555555;
      margin-top: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #555555; 
    }

    .profile-img {
      width: 180px; 
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      transition: transform 0.3s ease, box-shadow 0.3s ease; 
    }

    .profile-img:hover {
      transform: scale(1.05); 
      box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2); 
    }

    .joke-btn {
      background-color: #8b5cf6;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 20px 0;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .joke-btn:hover {
      background-color: #7c3aed; 
      transform: translateY(-3px); 
    }

    /* --- NEW: Styling for the Joke Display Box --- */
    #joke-display {
      background-color: #f8f9fa; /* Very soft gray */
      padding: 15px;
      border-radius: 10px;
      font-style: italic;
      color: #555;
      margin-top: 10px;
      min-height: 25px; /* Keeps the box from collapsing when empty */
    }

    .social-links {
      margin-top: 30px;
    }

    .social-links a {
      margin: 0 10px;
      text-decoration: none;
      color: #333333;
      font-weight: bold;
      display: inline-block; 
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .social-links a:hover {
      color: #8b5cf6; 
      transform: translateY(-5px); 
    }
  </style>
</head>

<body>

  <div class="card">
    
    <img src="Profpic.jpg" alt="Darren Pinheiro" class="profile-img">
    <h1>Darren Pinheiro</h1>

    <h2>About Me</h2>
    <p>Welcome to my page! I'm a developer building things from scratch and exploring the world of web development.</p>

    <button class="joke-btn" onclick="getJoke()">Tell me a Joke</button>

    <p id="joke-display">Click the button to load a joke!</p>

    <div class="social-links">
      <p style="font-size: 14px; color: #888;">Connect with me:</p>
      <a href="https://www.linkedin.com/in/darren-pinheiro-0480241a3" onclick="alert('Temporarily unavailable.'); return false;">LinkedIn</a>
      <a href="https://github.com/DarrenPinheiro/my-first-repo">GitHub</a>
      <a href="mailto:darren.pinhiro@trenser.com" onclick="alert('Currently not able to fetch the email servers.'); return false;">Email Me</a>
    </div>

  </div>

  <script>
    let jokeCount = 0;

    function getJoke() {
      jokeCount = jokeCount + 1;
      
      // BONUS: Change the text to say "Loading..." while we wait for the API!
      document.getElementById('joke-display').innerText = "Loading joke...";

      fetch('https://icanhazdadjoke.com/', {
        headers: {
          'Accept': 'application/json'
        }
      })
      .then(response => response.json())
      .then(data => {
        // 2. THE JAVASCRIPT ARROW: We tell JS to grab the "joke-display" box and inject the data!
        document.getElementById('joke-display').innerText = "Joke #" + jokeCount + ": " + data.joke;
      });
    }
  </script>

</body>

</html>
