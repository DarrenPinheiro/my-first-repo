<!DOCTYPE html>
<html>

<head>
  <title>Darren Pinheiro's Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: rgb(232, 189, 255);
    }

    h1 {
      color: #333333;
    }

.profile-img {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  object-fit: cover;
  /* This tells the browser to make the animation last 0.3 seconds */
  transition: transform 0.3s ease, box-shadow 0.3s ease; 
}

/* This is the new hover effect */
.profile-img:hover {
  /* This scales the image up by 5% */
  transform: scale(1.05); 
  /* This adds a soft dark shadow underneath */
  box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2); 
}

.social-links a {
  margin: 0 10px;
  text-decoration: none;
  color: #333333;
  font-weight: bold;
  display: inline-block; /* This allows the link to move up and down */
  transition: transform 0.3s ease, color 0.3s ease;
}

/* The new hover effect to make the links bounce and change color */
.social-links a:hover {
  color: #8b5cf6; /* Changes the text to a nice purple */
  transform: translateY(-5px); /* Moves the link up by 5 pixels */
}
  </style>
</head>

<body>

  <img src="Profpic.jpg" alt="Darren Pinheiro" class="profile-img">
  <h1>Darren Pinheiro</h1>

  <h2>About Me</h2>
  <p>Welcome to my page! I'm a developer building things from scratch and exploring the world of web development.</p>

  <div class="social-links">
    <p>Connect with me:</p>
    <a href="https://www.linkedin.com/in/darren-pinheiro-0480241a3">LinkedIn</a>
    <a href="https://github.com/DarrenPinheiro/my-first-repo">GitHub</a>
    <a href="mailto:darren.pinhiro@trenser.com">Email Me</a>
  </div>
</body>

</html>
