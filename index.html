<!DOCTYPE html>
<html>

<head>
  <title>Darren Pinheiro's Page</title>
  <style>
    /* --- NEW FLOATING CARD BACKGROUND --- */
    body {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif; 
      /* A beautiful, soft purple-to-blue gradient background */
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      color: #333333; 
      text-align: center;
      margin: 0;
      
      /* These 3 lines perfectly center the card in the middle of the screen */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- THE WHITE FLOATING CARD --- */
    .card {
      background-color: white;
      padding: 50px 40px;
      border-radius: 20px; /* Smooth rounded corners */
      box-shadow: 0 15px 35px rgba(0,0,0,0.1); /* The soft drop shadow */
      max-width: 600px;
      width: 90%; /* Keeps it looking great on mobile phones */
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 5px;
      font-size: 2.5rem;
    }

    h2 {
      color: #555555;
      margin-top: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #555555; /* Slightly softer gray for paragraph text */
    }

    /* --- YOUR AWESOME ANIMATIONS --- */
    .profile-img {
      width: 180px; /* Slightly smaller to fit the card beautifully */
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      transition: transform 0.3s ease, box-shadow 0.3s ease; 
    }

    .profile-img:hover {
      transform: scale(1.05); 
      box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2); 
    }

    .social-links {
      margin-top: 40px;
    }

    .social-links a {
      margin: 0 10px;
      text-decoration: none;
      color: #333333;
      font-weight: bold;
      display: inline-block; 
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .social-links a:hover {
      color: #8b5cf6; 
      transform: translateY(-5px); 
    }
  </style>
</head>

<body>

  <div class="card">
    
    <img src="Profpic.jpg" alt="Darren Pinheiro" class="profile-img">
    <h1>Darren Pinheiro</h1>

    <h2>About Me</h2>
    <p>Welcome to my page! I'm a developer building things from scratch and exploring the world of web development.</p>

    <div class="social-links">
      <p style="font-size: 14px; color: #888;">Connect with me:</p>
      <a href="https://www.linkedin.com/in/darren-pinheiro-0480241a3">LinkedIn</a>
      <a href="https://github.com/DarrenPinheiro/my-first-repo">GitHub</a>
      <a href="mailto:darren.pinhiro@trenser.com">Email Me</a>
    </div>

  </div>

</body>

</html>
